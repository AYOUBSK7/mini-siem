# Configuration nginx du laboratoire Mini-SIEM
# Rôle : reverse proxy devant Juice Shop + écriture du journal d'accès.

events {}

http {
    # --- Adresse IP du client --------------------------------------------
    # Tout le trafic du labo vient de mon PC, donc nginx verrait toujours la
    # même IP. Pour simuler plusieurs "visiteurs", attack_sim.py envoie un
    # en-tête X-Forwarded-For avec une fausse IP (plages de documentation
    # 192.0.2.x, 198.51.100.x, 203.0.113.x, réservées aux exemples).
    # Le module "realip" remplace alors $remote_addr par cette IP.
    # ATTENTION : en production on ne ferait confiance qu'à un proxy connu,
    # jamais à 0.0.0.0/0 (sinon un attaquant peut mentir sur son IP).
    set_real_ip_from 0.0.0.0/0;
    real_ip_header   X-Forwarded-For;

    # --- Journal d'accès ---------------------------------------------------
    # Format "combined" (le format standard d'nginx et d'Apache) :
    # IP - utilisateur [date] "METHODE /chemin?params HTTP/1.1" statut taille "referer" "agent"
    log_format combined_siem '$remote_addr - $remote_user [$time_local] '
                             '"$request" $status $body_bytes_sent '
                             '"$http_referer" "$http_user_agent"';

    access_log /logs/access.log combined_siem;
    error_log  /logs/error.log warn;

    server {
        listen 80;

        location / {
            # On transmet la requête à Juice Shop (nom du service Docker + port)
            proxy_pass http://juiceshop:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
