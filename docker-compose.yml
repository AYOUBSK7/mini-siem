# Laboratoire Mini-SIEM : tout se lance avec une seule commande
#   docker compose up -d
#
# Schéma :  navigateur / attack_sim.py --> nginx (port 8080) --> juiceshop
#                                            |
#                                            +--> logs/access.log  (lu par l'ETL)

services:

  # Application cible, volontairement vulnérable (OWASP Juice Shop).
  # Pas de "ports:" -> elle n'est PAS accessible directement depuis le PC,
  # seul nginx peut lui parler (par le réseau interne de Docker).
  juiceshop:
    image: bkimminich/juice-shop:latest
    container_name: siem_juiceshop
    restart: unless-stopped

  # Reverse proxy : reçoit toutes les requêtes, les transmet à Juice Shop
  # et écrit une ligne par requête dans access.log.
  nginx:
    image: nginx:1.27
    container_name: siem_nginx
    depends_on:
      - juiceshop
    ports:
      # 127.0.0.1 = seulement accessible depuis mon PC, pas depuis le réseau
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro   # notre configuration (lecture seule)
      - ./logs:/logs                                  # access.log apparaît dans ./logs
    restart: unless-stopped

  # Entrepôt de données (staging + dw). Le mot de passe vient du fichier .env
  postgres:
    image: postgres:16
    container_name: siem_postgres
    environment:
      POSTGRES_DB: ${PG_DB}
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    ports:
      - "127.0.0.1:${PG_PORT}:5432"
    volumes:
      - donnees_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d ${PG_DB}"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  # ---------------------------------------------------------------------
  #  Nos programmes Python (même image, construite depuis le Dockerfile)
  # ---------------------------------------------------------------------

  # API FastAPI : http://127.0.0.1:8000/docs
  api:
    build: .
    container_name: siem_api
    command: uvicorn api:app --app-dir app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      # Dans Docker, la base s'appelle "postgres" (nom du service), port interne 5432
      PG_HOST: postgres
      PG_PORT: "5432"
    depends_on:
      postgres:
        condition: service_healthy   # attendre que PostgreSQL soit prêt
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped

  # Dashboard Streamlit : http://127.0.0.1:8501
  # Il ne connaît PAS le mot de passe de la base : il passe par l'API.
  dashboard:
    build: .
    container_name: siem_dashboard
    command: streamlit run dashboard/dashboard.py --server.address 0.0.0.0 --server.port 8501 --server.headless true
    environment:
      API_URL: http://api:8000
    depends_on:
      - api
    ports:
      - "127.0.0.1:8501:8501"
    restart: unless-stopped

  # ETL + détection, lancés À LA DEMANDE (profil "outils" : pas démarré par "up") :
  #   docker compose run --rm pipeline
  pipeline:
    build: .
    profiles: ["outils"]
    command: sh -c "python app/etl.py && python app/detect.py"
    env_file: .env
    environment:
      PG_HOST: postgres
      PG_PORT: "5432"
    volumes:
      - ./logs:/code/logs:ro   # lecture seule : le pipeline lit le journal, ne le modifie pas
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  donnees_pg:
